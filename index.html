<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BeatForge · 浏览器里的音乐工作站。通道机架、步进序列器、钢琴卷帘、混音台与 28 种合成音色，全部实时合成，零采样文件。" />
    <meta name="theme-color" content="#0e1014" />
    <title>BeatForge · 浏览器音乐工作站</title>
    <style>
      /* 首屏骨架，避免加载时白屏闪烁 */
      html, body { margin: 0; height: 100%; background: #0e1014; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        font-family: -apple-system, 'Segoe UI', 'PingFang SC', sans-serif;
        color: #6b7484; font-size: 13px; letter-spacing: 0.02em;
      }
      #boot .mark {
        width: 32px; height: 32px; border-radius: 8px; margin: 0 auto 14px;
        background: linear-gradient(135deg, #ff8c3a, #ff5f6d);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
      @media (prefers-reduced-motion: reduce) { #boot .mark { animation: none } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div style="text-align:center">
        <div class="mark"></div>
        正在启动音频引擎…
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // 应用挂载完成后移除骨架
      const app = document.getElementById('app');
      const observer = new MutationObserver(() => {
        if (app.querySelector('.topbar')) {
          document.getElementById('boot')?.remove();
          observer.disconnect();
        }
      });
      observer.observe(app, { childList: true, subtree: true });
    </script>
  </body>
</html>
